[theme]
base = "light"
primaryColor = "#C15F3C"
backgroundColor = "#FAF9F5"
secondaryBackgroundColor = "#F0EEE6"
textColor = "#1F1E1D"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "'Source Serif 4':https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;500;600&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
baseRadius = "0.75rem"
showSidebarBorder = true
paddingTop = "1rem"

[theme.sidebar]
backgroundColor = "#F5F4EE"
secondaryBackgroundColor = "#ECEAE2"
textColor = "#1F1E1D"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

[server]
headless = true
# CORS and XSRF protection stay on (Streamlit's defaults): the app is shared publicly.
enableCORS = true
enableXsrfProtection = true
